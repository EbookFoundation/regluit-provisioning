---
###  Variables for prod-green ("batterup") — the Django 4.2 green box       ###
###  that takes over unglue.it at EIP flip.                                  ###
###                                                                          ###
###  Recipe = dj42's 2026-06-11 from-scratch rebuild (the dress rehearsal)   ###
###  + production identity (server_name, email, admin-emails).               ###
###  Sensitive vars reference vault.yml (copy of production vault).          ###
###  See 2026-06-11 Soft Launch Runsheet A4/C4; RUNBOOK_cutover_django42.md  ###

python_version: "3.12"
celery_major_version: 5
project_path: "/opt/regluit"
django_settings_module: "regluit.settings.prod"
virtualenv_name: "venv"
user_name: "ubuntu"
server_name: "unglue.it"
wsgi_home: "/opt/regluit/venv"
wsgi_python_path: "/opt/regluit/venv/bin/python3"
git_repo: "https://github.com/Gluejar/regluit.git"

# Launch content branch: prod-green = dj42.unglue.it content at SHA 13150c90
# (#1123 Django 4.2 branch, incl. #1145 + pyoai/#1149, + hotfixes #1157/#1158
# cherry-picked). Re-point + record new SHA if launch content changes.
git_branch: "prod-green"

le_endpoint: https://acme-v02.api.letsencrypt.org/directory
alt_server_name: "www.unglue.it"
deploy_type: 'prod'

# Cert plan — DECIDED 2026-06-15 (RY): DNS-01 PRE-ISSUE via Route 53, so green
# holds a valid unglue.it cert BEFORE the EIP flip → zero TLS-mismatch window.
#
# Why not the Ansible flow: roles/regluit_prod/tasks/certs.yml is HTTP-01 only
# (writes /var/www/.../.well-known/acme-challenge), which can't validate until
# unglue.it points here — i.e. not until after the flip. So keep manage_certs
# false (host-certbot pattern, same as dj42; apache.conf.j2 references
# /etc/letsencrypt/live/<server_name>/ paths) and pre-issue ONCE by hand:
#
#   sudo apt-get install -y certbot python3-certbot-dns-route53
#   sudo certbot certonly --dns-route53 \
#        -d unglue.it -d www.unglue.it \
#        --non-interactive --agree-tos -m <ops-email>
#
# Prereq: certbot needs AWS creds that can write the Route 53 zone TXT record
# (route53:ChangeResourceRecordSets + GetChange/ListHostedZones). The box's
# STANDING creds (vault aws_* = s3user) are S3-only — do NOT rely on them.
# Run the command at build time under an operator profile with Route 53 rights
# (e.g. AWS_PROFILE=ebookfoundation), or attach a scoped instance role just for
# issuance. unglue.it DNS is Route 53 (zone confirmed 2026-06-15), apex A
# record → the EIP, so DNS-01 is fully automatable.
#
# Renewal: AFTER the flip the domain points here, so certbot's normal HTTP-01
# renewal timer works like prod7 today — DNS-01 is only for the one pre-issue.
# Do NOT silently flip manage_certs to true.
manage_certs: false

# PRODUCTION behavior: error emails to admins MUST flow (Eric uses error-email
# volume as his intensity gauge — do not suppress on the box that becomes prod).
# Expect some noise during pre-flip validation; that is acceptable.
disable_admin_emails: false

# SSH access: green is built with the production key pair. Operators without
# the key at this path: override via ANSIBLE_SSH_PRIVATE_KEY_FILE or
# ~/.ssh/config, not by editing this file.
ansible_ssh_private_key_file: "/Volumes/ryvault1/gluejar/EC2_Keys/production.pem"

### Variables in settings.prod.py ###
mysql_db_name: "{{ vault_mysql_db_name }}"
mysql_db_user: "{{ vault_mysql_db_user }}"
mysql_db_pass: "{{ vault_mysql_db_pass }}"

# ============================================================================
# SAFETY-CRITICAL OVERRIDE — DO NOT REVERT TO "{{ vault_mysql_db_host }}"
# The vault value is the LIVE PRODUCTION RDS. Green must point at the green
# RDS (restored from a fresh prod snapshot) or its 4.2 migrations would run
# against production data. Fill in the green RDS endpoint at build time.
# ============================================================================
mysql_db_host: "FILL-IN-GREEN-RDS-ENDPOINT-AT-BUILD-TIME"

mysql_db_port: ""
email_host: "{{ vault_email_host }}"
email_port: 587
default_from_email: "unglueit@ebookfoundation.org"

### Variables in common.py ###
common_keys:
  booxtream_api_key: "{{ vault_booxtream_api_key }}"
  booxtream_api_user: "{{ vault_booxtream_api_user }}"
  dropbox_key: "{{ vault_dropbox_key }}"
  github_public_token: "{{ vault_github_public_token }}"
  mailchimp_api_key: "{{ vault_mailchimp_api_key }}"
  mailchimp_news_id: "{{ vault_mailchimp_news_id }}"
  mobigen_url:  "{{ vault_mobigen_url }}"
  mobigen_user_id:  "{{ vault_mobigen_user_id }}"
  mobigen_password:  "{{ vault_mobigen_password }}"
  ku_email:  "{{ vault_ku_email }}"
  ku_password:  "{{ vault_ku_password }}"
  stripe_pk:  "{{ vault_stripe_pk }}"
  stripe_sk:  "{{ vault_stripe_sk }}"
  librarything_key: "{{ vault_librarything_key }}"

### Variables in host.py ###
host_keys:
  secret_key: '{{ vault_secret_key }}'
  google_books_api_key: "{{ vault_google_books_api_key }}"
  email_host_user: '{{ vault_email_host_user }}'
  email_host_password:  '{{ vault_email_host_password }}'
  social_auth_google_oauth2_key: '{{ vault_social_auth_google_oauth2_key }}'
  social_auth_google_oauth2_secret: '{{ vault_social_auth_google_oauth2_secret }}'
  aws_access_key_id: '{{ vault_aws_access_key_id }}'
  aws_secret_access_key: '{{ vault_aws_secret_access_key }}'
  aws_storage_bucket_name:  '{{ vault_aws_storage_bucket_name }}'
  cf_turnstile_site_key:  '{{ vault_cf_turnstile_site_key }}'
  cf_turnstile_secret_key:  '{{ vault_cf_turnstile_secret_key }}'
