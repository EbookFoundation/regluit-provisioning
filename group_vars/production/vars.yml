---
###         Variables for Regluit Production Server             ###
### Sensitive vars are references to actual values in vault.yml ###
### Use ansible-vault view vault.yml to see the secret values   ###

project_path: "/opt/regluit"
django_settings_module: "regluit.settings.prod"
# Python the venv runs on (major.minor); see roles/regluit_prod/defaults/main.yml
python_version: "3.12"
virtualenv_name: "venv"
user_name: "ubuntu"
server_name: "unglue.it"
wsgi_home: "/opt/regluit/venv"
wsgi_python_path: "/opt/regluit/venv/bin/python3"
# mod_wsgi daemon-mode worker recycling (Gluejar/regluit#1078, provisioning#45).
# Tuned from prod traffic 2026-06-24: ~722 dynamic req/min across processes=2 =>
# ~361 req/min/process. 8000 => ~22 min/process lifetime, near the proven-safe
# cadence of the old 20-min restart band-aid but graceful/rolling. Self-regulating:
# recycles faster under heavier load. The template default (500) would recycle every
# ~80s here (cold-start churn) — DO NOT use the default on prod. Watch RSS/proc +
# PID turnover after apply and retune.
wsgi_maximum_requests: 8000
# Daemon-mode CPU parallelism. The box has 4 vCPUs; processes=2 (the inherited
# value) GIL-caps the app at ~2 cores while 2 sit idle, causing CPU-bound
# slowness under bot load (observed 2026-06-24: load ~4.6, 2 procs @ ~115% CPU,
# 7-11s responses). processes=4 uses all cores, ~restoring embedded-mode
# parallelism while keeping recycling + memory bounds. Gluejar/regluit#1078, #45.
wsgi_processes: 4
git_repo: "https://github.com/Gluejar/regluit.git"
git_branch: "production"
le_endpoint: https://acme-v02.api.letsencrypt.org/directory
#le_endpoint: https://acme-staging-v02.api.letsencrypt.org/directory
# Certs are managed by certbot/Let's Encrypt, NOT by this role. apache.conf.j2
# selects the certbot cert paths (/etc/letsencrypt/live/<server_name>/...) when
# manage_certs is false. Verified live 2026-06-22: /etc/letsencrypt/live/unglue.it/
# exists and the static /etc/ssl/certs/unglue.it.crt path does NOT — so this MUST
# stay false or apache fails to start. (Was a runtime -e override at cutover; now
# committed so master reflects production. Gluejar/regluit#1078 reconciliation.)
manage_certs: false
alt_server_name: "www.unglue.it"
deploy_type: 'prod'

### Variables in settings.prod.py ###
mysql_db_name: "{{ vault_mysql_db_name }}"
mysql_db_user: "{{ vault_mysql_db_user }}"
mysql_db_pass: "{{ vault_mysql_db_pass }}"
mysql_db_host: "{{ vault_mysql_db_host }}"
mysql_db_port: ""
email_host: "{{ vault_email_host }}"
email_port: 587
default_from_email: "unglueit@ebookfoundation.org"

### Variables in common.py ###
common_keys:
  booxtream_api_key: "{{ vault_booxtream_api_key }}"
  booxtream_api_user: "{{ vault_booxtream_api_user }}"
  dropbox_key: "{{ vault_dropbox_key }}"
  github_public_token: "{{ vault_github_public_token }}"
  mailchimp_api_key: "{{ vault_mailchimp_api_key }}"
  mailchimp_news_id: "{{ vault_mailchimp_news_id }}"
  mobigen_url:  "{{ vault_mobigen_url }}"
  mobigen_user_id:  "{{ vault_mobigen_user_id }}"
  mobigen_password:  "{{ vault_mobigen_password }}"
  ku_email:  "{{ vault_ku_email }}"
  ku_password:  "{{ vault_ku_password }}"
  stripe_pk:  "{{ vault_stripe_pk }}"
  stripe_sk:  "{{ vault_stripe_sk }}"
  librarything_key: "{{ vault_librarything_key }}"

### Variables in host.py ### 
host_keys:
  secret_key: '{{ vault_secret_key }}'
  google_books_api_key: "{{ vault_google_books_api_key }}"
  email_host_user: '{{ vault_email_host_user }}'
  email_host_password:  '{{ vault_email_host_password }}'
  social_auth_google_oauth2_key: '{{ vault_social_auth_google_oauth2_key }}'
  social_auth_google_oauth2_secret: '{{ vault_social_auth_google_oauth2_secret }}'
  aws_access_key_id: '{{ vault_aws_access_key_id }}'
  aws_secret_access_key: '{{ vault_aws_secret_access_key }}'
  aws_storage_bucket_name:  '{{ vault_aws_storage_bucket_name }}'
  cf_turnstile_site_key:  '{{ vault_cf_turnstile_site_key }}'
  cf_turnstile_secret_key:  '{{ vault_cf_turnstile_secret_key }}'

# Production: the monitoring crons (memory alert, wedged-wsgi auto-heal, apache
# liveness watchdog) are ON. Stated explicitly rather than left to the task's
# `default(true)`, so that production's state cannot be changed by a role
# default landing in another PR — the same reason the staging groups carry an
# explicit false. See EbookFoundation/security-private#32.
monitoring_alerts_enabled: true

# Firewall block (ufw deny, all ports), applied by roles/regluit_prod/tasks/main.yml
# under the `firewall` tag. Production only; test has no entries.
#
# 114.94.100.136/32
#   What: China Telecom Shanghai. whois netname CHINANET-SH, inetnum
#     114.80.0.0 - 114.95.255.255; no reverse DNS.
#   Why: on 2026-09-30 this one address had 15 connections open to prod at
#     once, and its /16 (114.94.x.x) held 67 of the 98 Apache workers stuck in
#     "reading request" while the site ran near its 150-worker limit. See
#     regluit-provisioning PR #91 (handshake timeout) and
#     EbookFoundation/security-private#33.
#   Added: Raymond Yee (via Claude), 2026-09-30.
#   Review: revisit by 2026-12-31. Remove it if the handshake timeout alone
#     keeps workers free. Taking it out of this list does not delete the rule
#     on the box: also run `sudo ufw delete deny from 114.94.100.136`.
firewall_blocked_sources:
  - source: 114.94.100.136/32
    comment: "regluit: stalled-connection source 2026-09-30, see security-private#33"
