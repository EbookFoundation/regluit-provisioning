- hosts: regluit-test
  gather_facts: false
  tasks:
    # Need to install python3.8 and pip first so Ansible will function
  - name: Install python3.8 and pip for dev
    become: true
    raw: bash -c "apt -qqy update && apt install -y python3.8  python3-pip python3-apt"
    register: output
    changed_when: output.stdout != ""

  - name: Gathering Facts
    setup:

  - import_role:
      name: regluit_prod

  # Scoped Stripe-key rotation for staging only (2026-08-28). Staging's
  # keys/common.py already carries the full secret set (rendered once,
  # unmanaged since) — we do NOT re-render the whole file here, that would
  # require vaulting every other secret too. Instead, surgically rewrite
  # just these two lines, leaving everything else on the box untouched.
  # Run with `--tags stripe` to rotate the key without re-running the rest
  # of setup-test.yml.
  - name: Rotate STRIPE_PK in keys/common.py (staging only, surgical)
    become: yes
    lineinfile:
      path: "{{ project_path }}/settings/keys/common.py"
      regexp: "^STRIPE_PK = os\\.environ\\.get\\('STRIPE_PK', '.*'\\)$"
      line: "STRIPE_PK = os.environ.get('STRIPE_PK', '{{ stripe_pk }}')"
    tags: [config, stripe]
    no_log: true          # renders vault secrets — never log / never --diff
    notify:
      - restart apache
      - restart celeryd
      - restart celerybeat

  - name: Rotate STRIPE_SK in keys/common.py (staging only, surgical)
    become: yes
    lineinfile:
      path: "{{ project_path }}/settings/keys/common.py"
      regexp: "^STRIPE_SK = os\\.environ\\.get\\('STRIPE_SK', '.*'\\)$"
      line: "STRIPE_SK = os.environ.get('STRIPE_SK', '{{ stripe_sk }}')"
    tags: [config, stripe]
    no_log: true          # renders vault secrets — never log / never --diff
    notify:
      - restart apache
      - restart celeryd
      - restart celerybeat
