- hosts: regluit-prod
  gather_facts: false
  tasks:
    # Need to install python3.8 and pip first so Ansible will function
  - name: Install python3.8 and pip for dev
    become: true
    raw: bash -c "apt -qqy update && apt install -y python3.8  python3-pip python3-apt"
    register: output
    changed_when: output.stdout != ""

  - name: Gathering Facts
    setup:

  - import_role:
      name: regluit_prod

  # Scoped Google-OAuth-client re-home, prod, narrower alternative to a full
  # role re-render (Gluejar/regluit#1246, 2026-09-02). group_vars/production's
  # host_keys already carries these two vars and a plain, untagged
  # `ansible-playbook -i hosts setup-prod.yml` (the full `import_role` above)
  # already re-renders keys/host.py correctly once the vault values are
  # rotated -- that path needs nothing new and remains the primary one. The
  # tasks below are an ADDITIONAL, narrower option: `--tags google-oauth`
  # rewrites just these two lines without touching the ~20 other unrelated
  # keys/host.py entries or re-running the rest of the role. Because they
  # both compute from the same underlying vault variables, running the plain
  # full playbook (which always executes the untagged tasks above) and this
  # tagged pair together is redundant but harmless -- same computed value,
  # written twice.
  #
  # No new vault variable names: this reuses the vault_social_auth_google_oauth2_key
  # / vault_social_auth_google_oauth2_secret entries group_vars/production's
  # vault file already defines (they already back the live Google client
  # today). RY: rotate those two existing entries -- see RUNBOOK_1246.md in
  # the regluit repo for the exact command -- before running with --tags
  # google-oauth (or before any full untagged run, which picks the change up
  # automatically via host_keys).
  - name: "Preflight: exactly one SOCIAL_AUTH_GOOGLE_OAUTH2_KEY/_SECRET line exists today"
    command: >-
      python3 -c "import re,sys; p='{{ project_path }}/settings/keys/host.py';
      pat=re.compile(r'^{{ item }}\s*='); print(sum(1 for l in open(p) if pat.match(l)))"
    register: _google_oauth_line_count
    changed_when: false
    check_mode: false     # pure read; run for real even under --check so the
                           # assert below is meaningful in a dry run too
    loop: [SOCIAL_AUTH_GOOGLE_OAUTH2_KEY, SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET]
    tags: [config, google-oauth]

  - name: "Preflight: fail loudly if that count is not exactly 1"
    assert:
      that: item.stdout | int == 1
      fail_msg: >-
        Expected exactly one {{ item.item }} assignment in keys/host.py,
        found {{ item.stdout }}. Refusing to edit -- the file's shape has
        drifted from what these tasks assume; fix by hand or update the
        pattern above.
    loop: "{{ _google_oauth_line_count.results }}"
    tags: [config, google-oauth]

  - name: "Preflight: new vault-sourced values are non-empty"
    assert:
      that:
        - social_auth_google_oauth2_key is defined
        - social_auth_google_oauth2_key | length > 0
        - social_auth_google_oauth2_secret is defined
        - social_auth_google_oauth2_secret | length > 0
      fail_msg: >-
        social_auth_google_oauth2_key/secret must be defined and non-empty --
        refusing to write an empty value onto production.
    no_log: true          # values live in the vault_ vars -- never log
    tags: [config, google-oauth]

  - name: Rotate SOCIAL_AUTH_GOOGLE_OAUTH2_KEY in keys/host.py (surgical alternative to full re-render)
    lineinfile:
      path: "{{ project_path }}/settings/keys/host.py"
      regexp: "^SOCIAL_AUTH_GOOGLE_OAUTH2_KEY\\s*=.*$"
      line: "SOCIAL_AUTH_GOOGLE_OAUTH2_KEY = os.environ.get('SOCIAL_AUTH_GOOGLE_OAUTH2_KEY', '{{ social_auth_google_oauth2_key }}')"
      validate: "/usr/bin/python3 -m py_compile %s"
    tags: [config, google-oauth]
    no_log: true          # renders vault secrets -- never log / never --diff
    notify:
      - restart apache
      - restart celeryd
      - restart celerybeat

  - name: Rotate SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET in keys/host.py (surgical alternative to full re-render)
    lineinfile:
      path: "{{ project_path }}/settings/keys/host.py"
      regexp: "^SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET\\s*=.*$"
      line: "SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET = os.environ.get('SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET', '{{ social_auth_google_oauth2_secret }}')"
      validate: "/usr/bin/python3 -m py_compile %s"
    tags: [config, google-oauth]
    no_log: true          # renders vault secrets -- never log / never --diff
    notify:
      - restart apache
      - restart celeryd
      - restart celerybeat

  # Note: these are FILE fallback values (`os.environ.get(NAME, <this>)`).
  # If SOCIAL_AUTH_GOOGLE_OAUTH2_KEY/_SECRET were ever set as real OS
  # environment variables for Apache/Celery on this box, that would win over
  # this file and a vault rotation here would silently not change the
  # effective runtime key -- worth checking first if a rotation does not
  # seem to take effect (same caveat PR #68 documented for Stripe).
