---
# Exercises the exact Jinja from roles/regluit_prod/tasks/certs_precheck.yml
# against hand-written renewal configs. localhost only, no remote host.
- hosts: localhost
  gather_facts: false
  vars:
    certbot_webroot: /var/lib/letsencrypt
    cases:
      - name: "good - map and path both point at us"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: true
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/lib/letsencrypt,
          [[webroot_map]]
          test.unglue.it = /var/lib/letsencrypt
      - name: "BAD - Codex's case: path right, hostname map wrong"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: false
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/lib/letsencrypt,
          [[webroot_map]]
          test.unglue.it = /var/www/html
      - name: "BAD - stale webroot_path, no map"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: false
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/www/html,
      - name: "BAD - apache plugin, not webroot"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: false
        text: |
          [renewalparams]
          authenticator = apache
          [[webroot_map]]
          test.unglue.it = /var/lib/letsencrypt
      - name: "BAD - a comment mentioning the right path must not pass"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: false
        text: |
          [renewalparams]
          authenticator = webroot
          # webroot_path = /var/lib/letsencrypt
          webroot_path = /var/www/html,
      - name: "good - no map at all, webroot_path correct"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: true
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/lib/letsencrypt,
      - name: "good - both names mapped correctly"
        server_name: unglue.it
        alt_server_name: www.unglue.it
        expect_ok: true
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/lib/letsencrypt,
          [[webroot_map]]
          unglue.it = /var/lib/letsencrypt
          www.unglue.it = /var/lib/letsencrypt
      - name: "BAD - alt name mapped elsewhere"
        server_name: unglue.it
        alt_server_name: www.unglue.it
        expect_ok: false
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/lib/letsencrypt,
          [[webroot_map]]
          unglue.it = /var/lib/letsencrypt
          www.unglue.it = /var/www/html
      - name: "BAD - alt name unmapped and webroot_path stale"
        server_name: unglue.it
        alt_server_name: www.unglue.it
        expect_ok: false
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/www/html,
          [[webroot_map]]
          unglue.it = /var/lib/letsencrypt
      - name: "good - multi-value webroot_path, last entry is ours"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: true
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/www/html,/var/lib/letsencrypt,
      - name: "BAD - prefix lookalike"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: false
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/lib/letsencrypt-old,
      # ConfigObj supports inline comments, quoting and spaces in values. A
      # mapping this check fails to PARSE looks like a mapping that is not
      # there, which would fall through to webroot_path and wrongly pass.
      - name: "BAD - hostname map wrong, hidden behind an inline comment"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: false
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/lib/letsencrypt,
          [[webroot_map]]
          test.unglue.it = /var/www/html # old webroot
      - name: "BAD - hostname map wrong and quoted"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: false
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/lib/letsencrypt,
          [[webroot_map]]
          test.unglue.it = "/var/www/html"
      - name: "BAD - hostname map wrong and contains a space"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: false
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/lib/letsencrypt,
          [[webroot_map]]
          test.unglue.it = /var/www/old html
      - name: "good - right map, with an inline comment after it"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: true
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/www/html,
          [[webroot_map]]
          test.unglue.it = /var/lib/letsencrypt # moved 2026-08-18
      - name: "good - right map, quoted"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: true
        text: |
          [renewalparams]
          authenticator = webroot
          webroot_path = /var/www/html,
          [[webroot_map]]
          test.unglue.it = '/var/lib/letsencrypt'
      - name: "BAD - authenticator webroot hidden behind an inline comment"
        server_name: test.unglue.it
        alt_server_name: ""
        expect_ok: false
        text: |
          [renewalparams]
          authenticator = apache # was webroot
          webroot_path = /var/lib/letsencrypt,

  tasks:
    - name: Evaluate each case with the production expressions
      vars:
        # Kept character-for-character in step with the expressions in
        # roles/regluit_prod/tasks/certs_precheck.yml.
        renewal_raw: "{{ item.text }}"
        server_name: "{{ item.server_name }}"
        alt_server_name: "{{ item.alt_server_name }}"
        renewal_clean: >-
          {{ renewal_raw
             | regex_replace('[ \t]+#[^\n]*$', '', multiline=True)
             | regex_replace(',[ \t]*$', '', multiline=True)
             | regex_replace('=[ \t]*([\'"])(.*)\1[ \t]*$', '= \2', multiline=True) }}
        webroot_path_list: >-
          {{ (renewal_clean | regex_search('^[ \t]*webroot_path[ \t]*=[ \t]*(.*?)[ \t]*$', '\1', multiline=True)
              | default([], true) | first | default(''))
             | split(',') | map('trim') | reject('equalto', '') | list }}
        webroot_path_effective: "{{ webroot_path_list | last | default('') }}"
        webroot_map: >-
          {{ dict(renewal_clean
                  | regex_findall('^[ \t]*([A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+)[ \t]*=[ \t]*(.+?)[ \t]*$', multiline=True)) }}
        expected_domains: >-
          {{ [server_name] + ([alt_server_name] if alt_server_name | default('') != '' else []) }}
        mapped_elsewhere: >-
          {{ expected_domains | select('in', webroot_map) | map('extract', webroot_map)
             | reject('equalto', certbot_webroot) | list }}
        unmapped_domains: "{{ expected_domains | reject('in', webroot_map) | list }}"
        verdict: >-
          {{ (renewal_clean | regex_search('^[ \t]*authenticator[ \t]*=[ \t]*webroot[ \t]*$', multiline=True) | ternary(true, false))
             and (mapped_elsewhere | length == 0)
             and ((unmapped_domains | length == 0) or (webroot_path_effective == certbot_webroot)) }}
      ansible.builtin.assert:
        that:
          - (verdict | bool) == (item.expect_ok | bool)
        fail_msg: >-
          MISMATCH on "{{ item.name }}": expected ok={{ item.expect_ok }},
          got {{ verdict }}. map={{ webroot_map }}
          path_effective='{{ webroot_path_effective }}'
          mapped_elsewhere={{ mapped_elsewhere }} unmapped={{ unmapped_domains }}
        success_msg: 'ok={{ verdict }} as expected -- {{ item.name }}'
      loop: "{{ cases }}"
      loop_control:
        label: "{{ item.name }}"
