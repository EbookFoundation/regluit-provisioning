---
# UNTESTED: the hosts this role served are dead (2026-08-30). Same bootstrap as
# the top-level playbooks: python3 and python3-apt are checked separately and
# installed only if missing, so "changed" is reported only when something was
# installed. (Was: an unconditional apt install of python3.8-dev + python3-pip.)
- name: Bootstrap - ensure python3 exists so Ansible modules can run
  become: true
  raw: test -x /usr/bin/python3 || (apt-get -qqy update && apt-get install -qqy python3 && echo BOOTSTRAP_INSTALLED)
  register: bootstrap_python
  changed_when: "'BOOTSTRAP_INSTALLED' in bootstrap_python.stdout"
  tags: [bootstrap]

- name: Bootstrap - ensure python3-apt exists so the apt module can run
  become: true
  raw: /usr/bin/python3 -c "import apt" 2>/dev/null || (apt-get -qqy update && apt-get install -qqy python3-apt && echo BOOTSTRAP_INSTALLED)
  register: bootstrap_apt
  changed_when: "'BOOTSTRAP_INSTALLED' in bootstrap_apt.stdout"
  tags: [bootstrap]

- name: Gathering Facts
  setup:
  tags: [always]

- name: Install base regluit dependencies
  become: true
  apt:
    name: ['git', 'python-setuptools', 'python-lxml', 'build-essential', 'libssl-dev', 'libffi-dev', 'libxml2-dev', 'libxslt-dev', 'mysql-server', 'mysql-client', 'libmysqlclient-dev', 'python-mysqldb', 'libcairo2']
    update_cache: true
    state: present

- name: Install virtualenv
  pip3:
    name: "virtualenv"
    state: present

- name: Install python packages to virtualenv
  pip3:
    requirements: "{{ project_path }}/requirements.txt"
    state: present
    virtualenv: "{{ project_path }}/venv"

- name: Add project to PYTHONPATH of virtualenv
  template:
    src: "{{ item }}.j2"
    dest: "{{ project_path }}/venv/lib/python{{ python_version }}/site-packages/{{ item }}"
  with_items:
    - 'regluit.pth'
    - 'opt.pth'

- name: Create keys directory
  file:
    path: "{{ project_path}}/settings/keys"
    state: directory

- name: Copy keys files
  copy:
    src: "{{ project_path }}/settings/dummy/__init__.py"
    dest: "{{ project_path }}/settings/keys/__init__.py"
    remote_src: yes

- name: Copy django settings template
  template:
    src: me.py.j2
    dest: "{{ project_path }}/settings/me.py"

- name: Copy key templates to keys directory
  template:
    src: "{{ item }}.j2"
    dest: "{{ project_path }}/settings/keys/{{ item }}"
  with_items:
    - 'common.py'
    - 'host.py'

- name: MySQL setup
  become: true
  import_tasks: mysql.yml

- name: Redis setup
  become: true
  import_tasks: redis.yml

# - name: Celery setup
#   import_tasks: celery.yml
