---
# Gate the restart on a config syntax check. Defined BEFORE `restart apache`
# so it runs first (handlers fire in definition order). If apache2ctl
# configtest fails on the freshly-rendered config, the play aborts here and
# `restart apache` never runs — apache keeps serving the old in-memory config
# instead of being restarted into a broken one. (Codex-recommended OOM-apply
# safety, Gluejar/regluit#1078.)
- name: validate apache config
  become: yes
  command: apache2ctl configtest
  changed_when: false

- name: restart apache
  become: yes
  service:
    name: apache2
    state: restarted

- name: restart journald
  become: yes
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

# Celery services load Django settings at startup only. Without these
# handlers, a settings re-render never reaches beat/workers — which is how
# the 2026-06-26 schedule revert sat invisible until beat happened to
# restart on 2026-07-01 (provisioning#37, regluit#1140).
- name: restart celeryd
  become: yes
  ansible.builtin.service:
    name: celeryd
    state: restarted

- name: restart celerybeat
  become: yes
  ansible.builtin.service:
    name: celerybeat
    state: restarted

- name: restart fail2ban
  become: yes
  ansible.builtin.service:
    name: fail2ban
    state: restarted

# Defined immediately after `restart fail2ban` so it runs after it: handlers fire
# in definition order. The failure it guards against is not subtle but it is
# silent from Ansible's point of view — a jail whose log file is missing or whose
# filter does not parse makes fail2ban refuse the whole configuration, so the
# service is not running at all and no jail is watching anything. Ask fail2ban
# what it is actually running rather than trusting that the unit came back.
- name: verify fail2ban jails
  become: yes
  ansible.builtin.command: fail2ban-client status
  register: f2b_status
  changed_when: false
  failed_when: >
    'regluit-flood' not in f2b_status.stdout or
    'regluit-expensive' not in f2b_status.stdout or
    'regluit-badbot' not in f2b_status.stdout
