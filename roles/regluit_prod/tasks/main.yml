---
- name: Install prod dependencies
  become: true
  apt:
    # List taken from feature/prod-green, the branch the June 2026 prod and
    # dj42 boxes were actually built from. Python-2-era names that Ubuntu 24.04
    # no longer offers (python-setuptools, python-dev) are gone; pkg-config was
    # added on that branch for Ubuntu 24.04 (its commit doesn't say which
    # package needs it). python3-pip used to come from the bootstrap
    # step and is kept here so a from-scratch build still gets it.
    name: ['git', 'libxml2-dev', 'libxslt1-dev', 'python3-lxml', 'python3-dev', 'python3-pip', 'python3-virtualenv', 'build-essential', 'libssl-dev', 'libffi-dev', 'default-mysql-client', 'default-libmysqlclient-dev', 'libcairo2', 'postfix', 'libjpeg-dev', 'pkg-config']
    update_cache: true
    state: present
    # Several of these are metapackages (default-mysql-client, ...). On a server
    # that already has the older names installed, apt could decide to remove
    # something to satisfy them. Fail instead of removing; a person decides.
    fail_on_autoremove: true
  tags: [packages]

- name: Create project directory
  become: true
  file: 
    path: "{{ project_path }}"
    state: directory
    owner: "{{ user_name }}"
    mode: 0755
  
- name: Checkout regluit repo
  git:
    accept_hostkey: yes
    force: yes
    repo: "{{ git_repo }}"
    dest: "{{ project_path }}"
    version: "{{ git_branch }}"
   
- name: Install python packages to virtualenv
  pip:
    requirements: "{{ project_path }}/requirements.txt"
    # present, not latest: a full run must not upgrade every unpinned package.
    # This does not freeze the venv - pip still moves versions to satisfy
    # explicit pins in requirements.txt.
    state: present
    virtualenv: "{{ project_path }}/venv"
    # --exists-action=w: when pip finds an existing checkout in venv/src that
    # conflicts with the requirement (a different repository URL or directory),
    # it would otherwise prompt "What to do?" into a pipe nobody can answer
    # (observed hanging deploys for an hour on 2026-06-11). "w" answers: wipe
    # and re-clone. A new commit at the same URL is just updated, no wipe.
    # Supersedes PR #39.
    extra_args: "--exists-action=w"

# Placed after the pip task so a from-scratch build has created the venv first.
- name: Check the venv runs the Python version this playbook expects
  # argv form: no shell and no free-form argument splitting, so quotes are safe.
  command:
    argv:
      - "{{ project_path }}/venv/bin/python"
      - "-c"
      - "import sys; print('%d.%d' % sys.version_info[:2])"
  register: venv_python
  changed_when: false
  check_mode: false     # read-only, so let it run under --check too
  tags: [python]

- name: Fail plainly when the venv and python_version disagree
  assert:
    that:
      - venv_python.stdout | trim == python_version
    fail_msg: >-
      venv is Python {{ venv_python.stdout | trim }}, playbook expects {{ python_version }}.
      Changing the app's Python version means rebuilding the venv - do not just edit python_version.
  tags: [python]

- name: Check the venv site-packages directory exists
  stat:
    path: "{{ project_path }}/venv/lib/python{{ python_version }}/site-packages"
  register: venv_site_packages
  failed_when: not venv_site_packages.stat.exists
  tags: [python]

- name: Add project to PYTHONPATH of virtualenv
  template:
    src: "{{ item }}.j2"
    dest: "{{ project_path }}/venv/lib/python{{ python_version }}/site-packages/{{ item }}"
  with_items:
    - 'regluit.pth'
    - 'opt.pth'
  tags: [python]

- name: Create lock directory
  become: yes
  file:
    path: "{{ project_path}}/.lock"
    state: directory
    owner: "{{ user_name }}"
    group: "www-data"
    mode: 0775


- name: Create keys directory
  file:
    path: "{{ project_path}}/settings/keys"
    state: directory
    owner: "{{ user_name }}"
    mode: 0755

- name: Copy keys files
  copy:
    src: "{{ project_path }}/settings/dummy/__init__.py"
    dest: "{{ project_path }}/settings/keys/__init__.py"
    remote_src: yes
  tags: [config]

- name: Copy django settings template
  template:
    src: prod.py.j2
    dest: "{{ project_path }}/settings/prod.py"
  tags: [config]
  no_log: true          # renders vault secrets — never log content / never --diff
  notify:
    - restart apache
    - restart celeryd
    - restart celerybeat

# Because the render above is no_log (its diff is invisible), assert the
# outcome we care about: the rendered file carries the 4-job Beat schedule
# under the Celery-5 name and no ignored old-name remnant. Guards against a
# recurrence of the silent 2026-06-26 revert (provisioning#37, regluit#1140).
# Matches only setting NAMES — no secret values touch the log.
- name: Verify rendered settings carry the 4-job Beat schedule (Celery-5 name)
  # NOTE: no single-quotes anywhere in this command — a lone quote (e.g. in a
  # grep pattern) breaks Ansible free-form arg splitting at parse time.
  shell: |
    set -e
    test "$(grep -c "CELERY_BEAT_SCHEDULE\[" {{ project_path }}/settings/prod.py)" -eq 4
    ! grep -q "CELERYBEAT_SCHEDULE" {{ project_path }}/settings/prod.py
  changed_when: false
  tags: [config]

- name: Copy key templates to keys directory
  template:
    src: "{{ item }}.j2"
    dest: "{{ project_path }}/settings/keys/{{ item }}"
  with_items:
    - 'common.py'
    - 'host.py'
  tags: [config]
  no_log: true          # renders vault secrets (incl. STRIPE_SK) — never log / never --diff
  notify:
    - restart apache
    - restart celeryd
    - restart celerybeat

# First build of a new box: pass -e stop_after_settings_render=true to stop
# here, check which database the rendered settings point at, then run again
# without it. Nothing before this point touches the database; collectstatic
# and migrate (tasks/apache.yml) are the first things that do.
# Only for a box that is not serving yet. `meta: end_host` does NOT flush
# handlers, so the restart apache / celeryd / celerybeat notifications from
# the two renders above are discarded: on a running box this leaves rewritten
# settings on disk while apache and celery keep serving the old values, and
# the next unrelated restart picks the change up invisibly. That is the drift
# the handler comments cite from provisioning#37 / regluit#1140.
- name: Stop after rendering settings when asked (check the database host first)
  meta: end_host
  when: stop_after_settings_render | default(false) | bool

- name: Copy sysadmin scripts to home directory
  become: yes
  template:
    src: "{{ item }}.j2"
    dest: "/home/{{ user_name }}/{{ item }}"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: 0755
  with_items:
    - 'setup.sh'
    - 'dump.sh'
  tags: [config]

- name: Copy mysql config file
  become: yes
  template:
    src: "{{ item }}.j2"
    dest: "/home/{{ user_name }}/{{ item }}"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: 0600
  tags: [config]
  no_log: true          # renders vault secret (mysql_db_pass) — never log content / never --diff
  with_items:
    - '.my.cnf'

- name: Create django log directory
  become: yes
  file: 
    path: "/var/log/regluit"
    state: directory
    owner: "{{ user_name }}"
    group: "www-data"
    mode: 02775

- name: Open ports on firewall
  become: yes
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  with_items:
    - '22'
    - '80'
    - '443'

- name: Configure swap (memory-pressure cushion)
  import_tasks: swap.yml
  tags: [swap, oom-hardening]

- name: Run redis tasks
  import_tasks: redis.yml

# - name: Run mysql tasks
#   import_tasks: mysql.yml

# apache.yml imports certs_precheck.yml itself, immediately before it renders
# prod.conf and with the same tags, so no tagged run can rewrite the vhost
# without first checking that this host's certificate and stored renewal
# settings match what the new config expects.
- name: Run apache tasks
  import_tasks: apache.yml

- name: Run cert tasks
  import_tasks: certs.yml

- name: Run celery tasks
  import_tasks: celery.yml

- name: Run cron tasks
  import_tasks: cron.yml

- name: Run monitoring tasks (memory alert + wsgi wedge watcher)
  import_tasks: monitoring.yml
  tags: [monitoring, oom-hardening]

- name: Run log management tasks
  import_tasks: log_management.yml

- name: Run OS patching / auto-reboot policy tasks
  import_tasks: patching.yml
  tags: [config, patching]


