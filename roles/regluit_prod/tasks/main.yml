---
- name: Safety check - non-production deploys must not use production database
  assert:
    that:
      - "deploy_type == 'prod' or 'production' not in mysql_db_host"
    fail_msg: >
      ABORTING: deploy_type={{ deploy_type }} but mysql_db_host={{ mysql_db_host }}
      contains 'production'. Non-production environments must use their own database.
      Check group_vars/{{ deploy_type }}/vault.yml vault_mysql_db_host.
  when: deploy_type is defined

- name: Install prod dependencies
  become: true
  apt:
    name: ['git', 'libxml2-dev', 'libxslt1-dev', 'python3-lxml', 'python3-dev', 'python3-virtualenv', 'build-essential', 'libssl-dev', 'libffi-dev', 'default-mysql-client', 'default-libmysqlclient-dev', 'libcairo2', 'postfix', 'libjpeg-dev', 'pkg-config']
    update_cache: true
    state: present

- name: Create project directory
  become: true
  file: 
    path: "{{ project_path }}"
    state: directory
    owner: "{{ user_name }}"
    mode: 0755
  
- name: Checkout regluit repo
  git:
    accept_hostkey: yes
    force: yes
    repo: "{{ git_repo }}"
    dest: "{{ project_path }}"
    version: "{{ git_branch }}"
   
- name: Install python packages to virtualenv
  pip:
    requirements: "{{ project_path }}/requirements.txt"
    state: present
    virtualenv: "{{ project_path }}/venv"

- name: Add project to PYTHONPATH of virtualenv
  template:
    src: "{{ item }}.j2"
    dest: "{{ project_path }}/venv/lib/python{{ python_version }}/site-packages/{{ item }}"
  with_items:
    - 'regluit.pth'
    - 'opt.pth'

- name: Create lock directory
  become: yes
  file:
    path: "{{ project_path}}/.lock"
    state: directory
    owner: "{{ user_name }}"
    group: "www-data"
    mode: 0775


- name: Create keys directory
  file:
    path: "{{ project_path}}/settings/keys"
    state: directory
    owner: "{{ user_name }}"
    mode: 0755

- name: Copy keys files
  copy:
    src: "{{ project_path }}/settings/dummy/__init__.py"
    dest: "{{ project_path }}/settings/keys/__init__.py"
    remote_src: yes

- name: Copy django settings template
  template:
    src: prod.py.j2
    dest: "{{ project_path }}/settings/prod.py"

- name: Copy key templates to keys directory
  template:
    src: "{{ item }}.j2"
    dest: "{{ project_path }}/settings/keys/{{ item }}"
  with_items:
    - 'common.py'
    - 'host.py'

- name: Copy sysadmin scripts to home directory
  become: yes
  template:
    src: "{{ item }}.j2"
    dest: "/home/{{ user_name }}/{{ item }}"
    mode: 0755
  with_items:
    - 'setup.sh'
    - 'dump.sh'
    - '.my.cnf'

- name: Copy mysql config file
  become: yes
  template:
    src: "{{ item }}.j2"
    dest: "/home/{{ user_name }}/{{ item }}"
    mode: 0600
  with_items:
    - '.my.cnf'

- name: Create django log directory
  become: yes
  file: 
    path: "/var/log/regluit"
    state: directory
    owner: "{{ user_name }}"
    group: "www-data"
    mode: 02775

- name: Open ports on firewall
  become: yes
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  with_items:
    - '22'
    - '80'
    - '443'

- name: Run redis tasks
  import_tasks: redis.yml

# - name: Run mysql tasks
#   import_tasks: mysql.yml

- name: Run apache tasks
  import_tasks: apache.yml

- name: Run cert tasks
  import_tasks: certs.yml
  when: manage_certs | default(true)

- name: Run celery tasks
  import_tasks: celery.yml

- name: Run cron tasks
  import_tasks: cron.yml

- name: Run log management tasks
  import_tasks: log_management.yml


