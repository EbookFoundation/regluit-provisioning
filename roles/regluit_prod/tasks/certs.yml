---
# Two ways to get a TLS certificate; a host uses at most one.
#
# manage_certs (default true): the original flow - hand-made keys and CSRs in
#   private/, Ansible's ACME modules, certs copied to /etc/ssl. No live box
#   uses this any more.
# certbot_manage (default false): certbot on the box, HTTP-01 through a
#   dedicated webroot served by the port-80 vhost (apache.conf.j2), plus a
#   deploy hook that reloads apache. This is the arrangement proven on
#   test.unglue.it on 2026-08-18 (regluit-provisioning#67).
#
# Production has manage_certs false and certbot_manage unset: this role does
# nothing about its certificate, as before.

- name: Legacy ACME certificate flow
  import_tasks: certs_acme_legacy.yml
  when: manage_certs | default(true) | bool

- name: Certbot certificate flow
  import_tasks: certs_certbot.yml
  when: certbot_manage | default(false) | bool
