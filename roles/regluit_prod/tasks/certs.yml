---
# Two ways to get a TLS certificate; a host uses at most one.
#
# manage_certs (default true): the original flow - hand-made keys and CSRs in
#   private/, Ansible's ACME modules, certs copied to /etc/ssl. No live box
#   uses this any more.
# certbot_manage (default false): certbot on the box, HTTP-01 through a
#   dedicated webroot served by the port-80 vhost (apache.conf.j2), plus a
#   deploy hook that reloads apache. This is the arrangement proven on
#   test.unglue.it on 2026-08-18 (regluit-provisioning#67).
#
# Production has manage_certs false and certbot_manage unset: this role does
# nothing about its certificate, as before.

# "At most one" was only a comment, and manage_certs defaults to TRUE: a host
# that sets certbot_manage and forgets manage_certs: false would run both
# flows, and apache.conf.j2 would then emit the legacy /etc/ssl cert paths
# inside the <IfFile /etc/letsencrypt/...> guard -- so the gate opens the
# moment certbot succeeds, onto a vhost pointing at files that do not exist.
# Make the invariant real. (Found by review of #78.)
- name: manage_certs and certbot_manage are mutually exclusive
  ansible.builtin.assert:
    that:
      - not (manage_certs | default(true) | bool and certbot_manage | default(false) | bool)
    fail_msg: >-
      Both manage_certs and certbot_manage are on for {{ inventory_hostname }}.
      A host uses at most one certificate flow; a certbot host needs
      manage_certs: false (see group_vars/test).
    success_msg: "One certificate flow at most, as required."
  tags: [certs]

- name: Legacy ACME certificate flow
  import_tasks: certs_acme_legacy.yml
  when: manage_certs | default(true) | bool

- name: Certbot certificate flow
  import_tasks: certs_certbot.yml
  when: certbot_manage | default(false) | bool
