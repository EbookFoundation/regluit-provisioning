---
# Wildcard certificate for *.unglue.it using Let's Encrypt DNS-01 challenge.
#
# Prerequisites (one-time, already done):
#   openssl genrsa -out private/letsencrypt_account.key 4096
#   openssl genrsa -out private/wildcard.unglue.it.key 4096
#   openssl req -new -sha256 -key private/wildcard.unglue.it.key \
#     -out private/wildcard.unglue.it.csr \
#     -subj "/CN=*.unglue.it" \
#     -addext "subjectAltName=DNS:*.unglue.it,DNS:unglue.it"
#
# The wildcard cert covers all *.unglue.it subdomains plus the bare domain.
# DNS-01 challenge is automated via Route53 using AWS credentials from vault.

- name: Decrypt key files
  copy:
    src: private/{{ item }}
    dest: private/decrypted/{{ item }}
  with_items:
    - 'letsencrypt_account.key'
    - 'wildcard.unglue.it.csr'
  delegate_to: 127.0.0.1

- name: Make sure ACME account exists
  acme_account:
    account_key_src: private/decrypted/letsencrypt_account.key
    acme_directory: "{{ le_endpoint }}"
    acme_version: 2
    state: present
    terms_agreed: yes
    contact:
    - mailto:support@ebookfoundation.org
  delegate_to: 127.0.0.1

- name: Fetch existing certs (if any)
  become: yes
  fetch:
    src: /etc/ssl/certs/{{ item }}
    dest: private/certs/{{ item }}
    flat: yes
    fail_on_missing: no
  with_items:
    - 'wildcard.unglue.it.crt'
    - 'wildcard.unglue.it.ca-bundle'
  tags:
    - certs

- name: Request wildcard certificate (step 1 - get challenge)
  acme_certificate:
    account_key_src: "private/decrypted/letsencrypt_account.key"
    acme_directory: "{{ le_endpoint }}"
    acme_version: 2
    remaining_days: 45
    force: yes
    challenge: dns-01
    select_crypto_backend: openssl
    csr: "private/decrypted/wildcard.unglue.it.csr"
    dest: "private/certs/wildcard.unglue.it.crt"
    fullchain_dest: "private/certs/wildcard.unglue.it.ca-bundle"
  delegate_to: 127.0.0.1
  register: acme_challenge

- name: Debug challenge data
  debug:
    msg: "{{ acme_challenge }}"

- name: Create DNS-01 challenge TXT records in Route53
  community.aws.route53:
    zone: "unglue.it"
    record: "{{ item.value['dns-01']['record'] }}"
    type: TXT
    ttl: 60
    value: "\"{{ item.value['dns-01']['resource_value'] }}\""
    state: present
    overwrite: yes
    aws_access_key: "{{ host_keys.aws_access_key_id }}"
    aws_secret_key: "{{ host_keys.aws_secret_access_key }}"
    wait: yes
  loop: "{{ acme_challenge.challenge_data_dns | dict2items }}"
  when: acme_challenge is changed
  delegate_to: 127.0.0.1

- name: Wait for DNS propagation
  pause:
    seconds: 30
  when: acme_challenge is changed

- name: Validate challenge and retrieve wildcard certificate (step 2)
  acme_certificate:
    account_key_src: private/decrypted/letsencrypt_account.key
    acme_directory: "{{ le_endpoint }}"
    acme_version: 2
    force: no
    remaining_days: 45
    challenge: dns-01
    select_crypto_backend: openssl
    csr: "private/decrypted/wildcard.unglue.it.csr"
    dest: "private/certs/wildcard.unglue.it.crt"
    fullchain_dest: "private/certs/wildcard.unglue.it.ca-bundle"
    data: "{{ acme_challenge }}"
  delegate_to: 127.0.0.1

- name: Clean up DNS-01 challenge TXT records
  community.aws.route53:
    zone: "unglue.it"
    record: "{{ item.value['dns-01']['record'] }}"
    type: TXT
    ttl: 60
    value: "\"{{ item.value['dns-01']['resource_value'] }}\""
    state: absent
    aws_access_key: "{{ host_keys.aws_access_key_id }}"
    aws_secret_key: "{{ host_keys.aws_secret_access_key }}"
  loop: "{{ acme_challenge.challenge_data_dns | dict2items }}"
  when: acme_challenge is changed
  delegate_to: 127.0.0.1

- name: Copy wildcard cert to server
  become: yes
  copy:
    src: "private/certs/{{ item }}"
    dest: "/etc/ssl/certs/{{ item }}"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: 0600
  with_items:
    - 'wildcard.unglue.it.crt'
    - 'wildcard.unglue.it.ca-bundle'
  notify:
    - restart apache
  tags:
    - certs

- name: Copy wildcard key to server
  become: yes
  copy:
    src: "private/wildcard.unglue.it.key"
    dest: "/etc/ssl/private/server.key"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: 0600
  notify:
    - restart apache
  tags:
    - certs

- name: Delete decrypted files
  file:
    path: "private/decrypted/{{ item }}"
    state: absent
  with_items:
    - 'letsencrypt_account.key'
    - 'wildcard.unglue.it.csr'
  delegate_to: 127.0.0.1
