---
- name: Install apache
  become: yes
  apt:
    name: ['apache2', 'libapache2-mod-wsgi-py3', 'cronolog']
    state: present

- name: Ensure apache is running and enabled
  become: yes
  service: 
    name: apache2
    state: started
    enabled: yes

- name: Create apache config
  become: yes
  tags: [apache-config, oom-hardening]
  template:
    src: apache.conf.j2
    dest: "/etc/apache2/sites-available/prod.conf"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: 0664
    backup: yes
  notify:
    - validate apache config
    - restart apache

- name: Create static directory
  become: yes
  file: 
    path: "/var/www/static"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: 0755

- name: Create WSGI Script
  become: yes
  # tags: [config] — this is the third and last render of vault credentials in
  # this role; the other two ("Copy django settings template" -> settings/prod.py
  # and "Copy key templates to keys directory" -> settings/keys/host.py) are both
  # already tags: [config]. Without a tag here, prod.wsgi could only be
  # re-rendered by a full, untagged setup-prod.yml run, so a credential rotation
  # updated settings/keys/host.py while leaving prod.wsgi holding the OLD value.
  # That drift is not cosmetic: host.py renders each name as
  #   NAME = os.environ.get('NAME', '<rendered>')
  # while prod.wsgi assigns os.environ['NAME'] before Django loads. So for the
  # names in host_keys -- not for the environment as a whole -- the prod.wsgi
  # value takes precedence over host.py's fallback in the mod_wsgi process.
  # Celery never loads prod.wsgi (celeryd.service runs `celery -A regluit`), so
  # it keeps host.py's value: that is how the two can disagree with no visible
  # error until a send or an upload fails.
  tags: [config]
  template:
    src: prod.wsgi.j2
    dest: "{{ project_path }}/deploy/prod.wsgi"
    owner: "{{ user_name }}"
    # group www-data + 0640: prod.wsgi embeds plaintext secrets (host_keys as
    # env exports). Was 0664 (world-readable). WSGIDaemonProcess sets no
    # user=/group=, so the (wsgi:regluit) daemons run as APACHE_RUN_USER
    # (www-data) and read the script via the www-data group; the owner
    # ({{ user_name }}) keeps read/write; the world bit is removed.
    # Checked read-only 2026-09-10 on prod (4 daemons) and test (2 daemons):
    # all www-data:www-data. Similar in spirit to the 0600 .my.cnf hardening,
    # but keeps group read for the daemon.
    group: www-data
    mode: '0640'
  no_log: true          # renders vault values (host_keys: SECRET_KEY, AWS, SES,
                        # OAuth, Turnstile) as env exports. no_log suppresses this
                        # task's normal result and diff output; it is not global
                        # redaction. Was the last such render in this role without it.
  # Validation FIRST, then the restart. Under --tags config the "Create apache
  # config" task above is skipped, so nothing else notifies "validate apache
  # config" -- and a handler runs only when notified. Defining validate before
  # restart in handlers/main.yml fixes their relative ORDER, it does not make
  # validation a prerequisite. Without this line a tagged run could bounce
  # apache without ever configtesting what is on disk, turning a working server
  # into an outage if that config (or a cert path it names) is broken.
  #
  # apache only: celeryd/celerybeat never load prod.wsgi, so notifying them here
  # would restart them for nothing -- not a no-op, just pointless. The host.py
  # render already notifies both where it matters (tasks/main.yml).
  #
  # The restart makes pickup deterministic rather than being the only path: in
  # daemon mode mod_wsgi may recycle the daemon on a later request when the
  # script file changes, which can happen before Ansible reaches its handlers.
  notify:
    - validate apache config
    - restart apache

- name: Remove apache2 logrotate file
  become: yes
  file:
    path: /etc/logrotate.d/apache2
    state: absent
  notify: 
    - restart apache

- name: Disable default site
  become: yes
  command: a2dissite 000-default
  notify:
    - restart apache

- name: Enable prod site
  become: yes
  command: a2ensite prod
  notify:
    - restart apache

- name: Enable SSL rewrite headers
  become: yes
  command: a2enmod ssl rewrite headers logio
  notify: 
    - restart apache

- name: Generate static files
  django_manage:
    app_path: "{{ project_path }}"
    command: "collectstatic"
    virtualenv: "{{ project_path }}/venv"
    settings: "{{ django_settings_module }}"
  notify:
    - restart apache

- name: Migrate database
  django_manage:
    app_path: "{{ project_path }}"
    command: "migrate --noinput"
    virtualenv: "{{ project_path }}/venv"
    settings: "{{ django_settings_module }}"
  notify:
    - restart apache

- name: Localize Site row to this box's hostname
  # Fixes regluit#1164: snapshot-restored staging boxes inherit prod's Site row
  # (domain='unglue.it'), causing emailed links to point at prod.
  # server_name is the bare apex hostname (no www.) for every box, so it maps
  # directly to the desired Site domain.
  # Guarded off on production: prod's Site row is already correct, so this makes
  # "never mutate prod's Site row" a hard guarantee rather than a no-op-by-luck
  # (Codex review 2026-06-16).
  django_manage:
    app_path: "{{ project_path }}"
    command: "set_site_domain {{ server_name }}"
    virtualenv: "{{ project_path }}/venv"
    settings: "{{ django_settings_module }}"
  register: set_site_domain_result
  # The command prints "Updated Site ..." only when it actually wrote to the DB;
  # otherwise it prints a "no-op" line. Report changed only on a real write.
  changed_when: "'Updated Site' in (set_site_domain_result.out | default(''))"
  when: server_name != "unglue.it"
