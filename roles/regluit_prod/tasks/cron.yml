---
# Cron jobs for log cleanup and maintenance
# See: https://github.com/Gluejar/regluit/issues/1111 (disk/log management)
# See: https://github.com/Gluejar/regluit/issues/1078 (bot traffic)

# REMOVED: the periodic `service apache2 restart` band-aid (Gluejar/regluit#1078).
# Forensics on the 2026-06-22 OOM showed systemd's SIGKILL does NOT reap the
# mod_wsgi daemon processes ("Unit process ... remains running after unit stopped",
# "Found left-over process ... Ignoring"). Each restart spawned fresh workers while
# the bloated old ones survived, accumulating to ~13.3 GB across ~6 orphaned workers
# before the OOM. Proper, clean recycling is now handled by WSGIDaemonProcess
# maximum-requests (see templates/apache.conf.j2), so this cron is not merely
# unnecessary, it was actively harmful. state: absent removes it from any
# already-provisioned box.
- name: Remove obsolete apache-restart workaround cron
  become: yes
  ansible.builtin.cron:
    name: "apache-restart-workaround"
    state: absent
    user: root
  tags: [apache-restart-cleanup, oom-hardening]

# Apache access logs can reach 1GB/day under bot traffic.
# cronolog creates dated files but doesn't clean them up.
- name: Clean up old Apache logs (uncompressed older than 7 days)
  become: yes
  ansible.builtin.cron:
    name: "apache-log-cleanup"
    minute: "0"
    hour: "3"
    job: "find /var/log/apache2 -name '*.log' -mtime +7 -delete"
    user: root

- name: Clean up old Apache logs (compressed older than 14 days)
  become: yes
  ansible.builtin.cron:
    name: "apache-log-cleanup-gz"
    minute: "5"
    hour: "3"
    job: "find /var/log/apache2 -name '*.log.gz' -mtime +14 -delete"
    user: root

- name: Compress Apache logs older than 2 days
  become: yes
  ansible.builtin.cron:
    name: "apache-log-compress"
    minute: "10"
    hour: "3"
    job: "find /var/log/apache2 -name '*.log' -mtime +2 ! -name '$(date +\\%Y\\%m\\%d)_*' -exec gzip -q {} \\;"
    user: root

# Celery worker log grows unbounded — truncate weekly
- name: Truncate celery worker log weekly
  become: yes
  ansible.builtin.cron:
    name: "celery-log-truncate"
    minute: "15"
    hour: "3"
    weekday: "0"
    job: "tail -5000 /var/log/celery/w1.log > /var/log/celery/w1.log.tmp && mv /var/log/celery/w1.log.tmp /var/log/celery/w1.log && chown celery:www-data /var/log/celery/w1.log"
    user: root

# Clean up old celery metrics HTML files (older than 30 days)
- name: Clean up old celery metrics
  become: yes
  ansible.builtin.cron:
    name: "celery-metrics-cleanup"
    minute: "20"
    hour: "3"
    job: "find /var/log/celery -name 'metrics-*.html' -mtime +30 -delete"
    user: root

# Clean up old regluit app logs (older than 30 days)
- name: Clean up old regluit app logs
  become: yes
  ansible.builtin.cron:
    name: "regluit-log-cleanup"
    minute: "25"
    hour: "3"
    job: "find /var/log/regluit -name '*.log' -mtime +30 -delete && find /var/log/regluit -name '*.log.*' -mtime +30 -delete"
    user: root

# Remove manually-added cron.d file (now managed by Ansible)
- name: Remove manual cleanup-apache-logs cron.d file
  become: yes
  ansible.builtin.file:
    path: /etc/cron.d/cleanup-apache-logs
    state: absent

# DOAB OAI harvest — runs nightly on production only.
# Matches doab-check's cadence (nightly load_doab) per Gluejar/regluit#1129
# and Eric's direction (2026-04-23 meeting).
#
# Window: 3 days back -> open-ended. The 3-day overlap is intentional —
# load_doab dedupes by record id, so re-fetching is cheap and resilient
# to occasional missed nights (server reboot, transient OAI 5xx, etc.).
# Output (incl. stderr) appended to /var/log/regluit/doab-harvest.log,
# which is rotated by the existing "regluit-log-cleanup" task above.
- name: DOAB harvest (nightly)
  become: yes
  ansible.builtin.cron:
    name: "regluit-doab-harvest"
    minute: "30"
    hour: "4"
    user: "{{ user_name }}"
    job: 'cd {{ project_path }} && DJANGO_SETTINGS_MODULE={{ django_settings_module }} {{ project_path }}/{{ virtualenv_name }}/bin/django-admin load_doab "$(date -u -d ''3 days ago'' +\%Y-\%m-\%d)" --max=20000 >> /var/log/regluit/doab-harvest.log 2>&1'
  when: deploy_type | default('') == 'prod'
