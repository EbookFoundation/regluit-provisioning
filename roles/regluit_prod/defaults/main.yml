---
# Major.minor Python the app's virtualenv runs on. Used for the venv
# site-packages path and checked by the venv assertion in tasks/main.yml.
# An OS package revision (3.12.3-1ubuntu0.15 -> .16) does not change this.
# Changing it means rebuilding the venv, not just editing this value.
python_version: "3.12"

# Run celery Beat (the scheduler). Set false on a staging box built from a
# copy of production data, so no scheduled job runs there by accident.
celerybeat_enabled: true

# Schedule mem_alert.sh and wsgi_wedge_watch.sh, which send mail through the
# local sendmail. The scripts are installed either way; false leaves their
# cron entries in place but commented out.
# Note what else false costs: wsgi_wedge_watch.sh does not only alert, it also
# kills wedged mod_wsgi daemon processes so they respawn (regluit#1204). Off
# means no auto-heal either, which is acceptable on a staging box and is not
# something to turn off on a host that serves users.
monitoring_alerts_enabled: true

# Turn on the app's non-production email safety net (regluit#1238,
# regluit/utils/safe_email_backend.py) for both the web app and celery.
# With no allowlist and no redirect address, the app refuses to send to
# anyone rather than delivering to a real user.
email_safe_mode: false
email_safe_mode_allowed_domains: ""
email_safe_mode_allowed_addresses: ""
email_safe_mode_redirect_to: ""

# Certbot-managed certificates (tasks/certs_certbot.yml). Off by default;
# production's certificate is managed outside this role.
certbot_manage: false
certbot_webroot: /var/lib/letsencrypt
certbot_email: support@ebookfoundation.org

# Apache timeouts (templates/regluit-timeouts.conf.j2, issue #81). Before this,
# the box ran Ubuntu's stock values, which no playbook set.
#
# Timeout: how long Apache waits on a single read or write before giving up.
# It is an idle limit per I/O, not a cap on the whole response, so a slow
# download that keeps moving is not cut off. 300 is Ubuntu's stock value; this
# makes it managed without changing it. Lowering it has a cost: mod_wsgi's
# socket-timeout defaults to it, so a Django page slower than this becomes a
# 504 while its thread keeps running. Prod, 2026-09-24..30: 477 successful
# responses took over 60 s (mostly OPDS feeds while the box was saturated).
apache_timeout: 300

# mod_reqtimeout limits for the stages before Django sees a request. Stock
# Ubuntu sets header and body only; the handshake stage (TLS setup) is off, so
# a client that connects and stalls mid-handshake holds a worker for the full
# Timeout. Seen on prod 2026-09-30: ~100 of 150 workers stuck in "reading
# request" with the database idle (security-private#33).
# Format: stage=seconds[-max_seconds][,MinRate=bytes_per_second], per stage.
apache_request_read_timeout: "handshake=10-20,MinRate=500 header=20-40,MinRate=500 body=10,MinRate=500"

# Sources to drop at the firewall (tasks/main.yml, ufw). Empty = no change.
# Needs ufw to be active on the host; the play stops with a message if it is
# not, rather than adding rules that do nothing. Removing an entry here does
# NOT remove its rule; delete it by hand (`ufw delete deny from <cidr>`).
firewall_blocked_sources: []
# - 114.94.100.136/32   # 15 open connections to prod during the 2026-09-30 saturation
