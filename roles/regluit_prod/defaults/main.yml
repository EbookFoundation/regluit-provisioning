---
# Major.minor Python the app's virtualenv runs on. Used for the venv
# site-packages path and checked by the venv assertion in tasks/main.yml.
# An OS package revision (3.12.3-1ubuntu0.15 -> .16) does not change this.
# Changing it means rebuilding the venv, not just editing this value.
python_version: "3.12"

# Run celery Beat (the scheduler). Set false on a staging box built from a
# copy of production data, so no scheduled job runs there by accident.
celerybeat_enabled: true

# Schedule mem_alert.sh and wsgi_wedge_watch.sh, which send mail through the
# local sendmail. The scripts are installed either way; false leaves their
# cron entries in place but commented out.
# Note what else false costs: wsgi_wedge_watch.sh does not only alert, it also
# kills wedged mod_wsgi daemon processes so they respawn (regluit#1204). Off
# means no auto-heal either, which is acceptable on a staging box and is not
# something to turn off on a host that serves users.
monitoring_alerts_enabled: true

# Turn on the app's non-production email safety net (regluit#1238,
# regluit/utils/safe_email_backend.py) for both the web app and celery.
# With no allowlist and no redirect address, the app refuses to send to
# anyone rather than delivering to a real user.
email_safe_mode: false
email_safe_mode_allowed_domains: ""
email_safe_mode_allowed_addresses: ""
email_safe_mode_redirect_to: ""

# Certbot-managed certificates (tasks/certs_certbot.yml). Off by default;
# production's certificate is managed outside this role.
certbot_manage: false
certbot_webroot: /var/lib/letsencrypt
certbot_email: support@ebookfoundation.org

# Django's shared cache for the OPDS feeds, CACHES['opds'] (regluit#1257;
# templates/prod.py.j2 says why it is not the default cache). Redis already
# runs on the box as Celery's broker (DB 0) and result store (DB 1), both set
# in the app's settings/common.py. The cache gets its own logical DB so
# `redis-cli -n 2` shows only cache keys, and a KEY_PREFIX so it is
# identifiable if it ever shares a DB with anything else.
django_cache_redis_url: "redis://127.0.0.1:6379/2"
django_cache_key_prefix: "regluit"

# Redis memory cap and eviction policy (tasks/redis.yml). The cache shares
# this Redis with Celery's queue, and the queue must never be evicted.
# volatile-lru only evicts keys that carry an expiry: every feed cache entry
# has one (an hour), and Celery's queue keys never do. So when the cap is
# reached, cache entries go first and queued tasks are never dropped.
# Celery's stored task results (DB 1) also expire (a day, Celery's default),
# so they can be evicted too; the app reads a few back (core.models.CeleryTask,
# e.g. LibraryThing import status), and an evicted one reads as PENDING.
# The cap is far above what the app should use (the OPDS feed cache is on the
# order of tens of MB at a 1-hour lifetime); it is there so a runaway cache
# cannot eat the box's memory, not to squeeze Redis.
# The one way this cap can hurt: if non-expiring keys (a large Celery backlog)
# alone reach it, Redis refuses new writes, so new tasks fail to queue. Check
# `redis-cli INFO memory` before lowering it. In megabytes (Redis's "mb",
# 1024*1024 bytes).
redis_maxmemory_mb: 256
redis_maxmemory_policy: "volatile-lru"
# Policy first, then cap (see tasks/redis.yml). `live` is how
# `CONFIG GET` reports the value, for the idempotence check.
redis_memory_settings:
  - { name: "maxmemory-policy", value: "{{ redis_maxmemory_policy }}", live: "{{ redis_maxmemory_policy }}" }
  - { name: "maxmemory", value: "{{ redis_maxmemory_mb }}mb", live: "{{ redis_maxmemory_mb | int * 1048576 }}" }
